<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wegweiser — Your German Companion</title>
<style>
:root{
  --ink:#1E2A38;
  --ink-light:#2C3E50;
  --paper:#F5F3ED;
  --paper-dim:#EAE6DA;
  --panel:#FFFFFF;
  --gold:#C68A2E;
  --gold-dim:#E8CE9C;
  --teal:#2F5D50;
  --teal-dim:#DCE9E4;
  --brick:#A6423F;
  --brick-dim:#F2DCDA;
  --text:#20242A;
  --text-dim:#4F5860;
  --border:#DAD5C6;
  --radius:4px;
  --serif:'Source Serif 4','Iowan Old Style',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
  --mono:'SFMono-Regular',Consolas,monospace;
}
[data-theme="dark"]{
  --ink:#F5F3ED;
  --ink-light:#EAE6DA;
  --paper:#161B22;
  --paper-dim:#1E2530;
  --panel:#20272F;
  --gold:#D9A441;
  --gold-dim:#3A3220;
  --teal:#5BA893;
  --teal-dim:#1C2E2A;
  --brick:#D4726D;
  --brick-dim:#3A2422;
  --text:#EDEBE3;
  --text-dim:#9AA3AC;
  --border:#333B45;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit;text-align:left;font-size:1rem;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;scroll-behavior:auto !important;}
}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0 0 .4em;color:var(--ink);}
p{line-height:1.6;}
a{color:var(--gold);}
#app{min-height:100vh;}

/* ---------- Shell layout ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--ink);color:var(--paper);
  display:flex;flex-direction:column;padding:20px 0;overflow-y:auto;max-height:100vh;
  position:sticky;top:0;
}
.sidebar .brand{
  font-family:var(--serif);font-size:1.35rem;font-weight:700;padding:0 20px 18px;
  border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:10px;color:var(--paper);
  letter-spacing:.02em;
}
.sidebar .brand small{display:block;font-family:var(--sans);font-size:.68rem;
  font-weight:400;color:var(--gold);margin-top:3px;letter-spacing:.06em;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:11px 20px;color:rgba(245,243,237,.75);
  border-left:3px solid transparent;font-size:.93rem;transition:background .12s;
  width:100%;cursor:pointer;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--paper);}
.nav-item.active{border-left-color:var(--gold);background:rgba(255,255,255,.08);color:var(--paper);font-weight:600;}
.nav-item .icon{width:18px;text-align:center;font-size:1rem;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;border-bottom:1px solid var(--border);background:var(--panel);
}
.topbar .stamp-row{display:flex;gap:10px;align-items:center;}
.content{padding:28px;max-width:920px;width:100%;margin:0 auto;flex:1;}

/* ---------- Reusable bits ---------- */
.stamp{
  display:inline-flex;align-items:center;justify-content:center;
  border:2px solid var(--gold);color:var(--gold);border-radius:50%;
  width:38px;height:38px;font-family:var(--serif);font-weight:700;font-size:.8rem;
  transform:rotate(-6deg);flex-shrink:0;
}
.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:18px;
}
.panel-note{
  border-left:3px solid var(--gold);background:var(--gold-dim);
  padding:14px 16px;border-radius:0 var(--radius) var(--radius) 0;margin:14px 0;
}
.panel-note.error{border-left-color:var(--brick);background:var(--brick-dim);}
.panel-note.success{border-left-color:var(--teal);background:var(--teal-dim);}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:var(--radius);
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:.9rem;font-weight:600;
}
.btn:hover{opacity:.88;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--border);}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1408;}
.btn.block{width:100%;justify-content:center;}
.btn.small{padding:9px 14px;font-size:.8rem;}
.grid{display:grid;gap:16px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:720px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr;}}
.pill{
  display:inline-block;padding:3px 11px;border-radius:20px;font-size:.72rem;font-weight:600;
  border:1px solid var(--border);color:var(--text-dim);
}
.pill.on{background:var(--teal-dim);color:var(--teal);border-color:var(--teal);}
.choice-grid{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;}
.choice{
  padding:10px 16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);
  font-size:.9rem;color:var(--text);
}
.choice:hover{border-color:var(--gold);}
.choice.selected{border-color:var(--gold);background:var(--gold-dim);font-weight:600;}
.progress-bar{height:8px;background:var(--paper-dim);border-radius:4px;overflow:hidden;margin:6px 0;}
.progress-bar > div{height:100%;background:var(--teal);}
.skill-row{display:flex;align-items:center;gap:12px;margin:10px 0;}
.skill-row .label{width:110px;font-size:.85rem;color:var(--text-dim);flex-shrink:0;}
.skill-row .progress-bar{flex:1;}
.skill-row .pct{width:38px;text-align:right;font-size:.82rem;font-variant-numeric:tabular-nums;}
table.vocab-table{width:100%;border-collapse:collapse;font-size:.88rem;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
@media (max-width:520px){ .hide-narrow{display:none;} }
table.vocab-table th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);color:var(--text-dim);font-weight:600;font-size:.78rem;text-transform:none;}
table.vocab-table td{padding:8px 10px;border-bottom:1px solid var(--border);}
table.vocab-table tr:hover td{background:var(--paper-dim);}
.article-der{color:#2C6FB0;font-weight:600;}
.article-die{color:#B0442C;font-weight:600;}
.article-das{color:#3C8B4A;font-weight:600;}
.exercise-box{border:1px solid var(--border);border-radius:var(--radius);padding:22px;background:var(--panel);}
.exercise-prompt{font-size:1.15rem;margin-bottom:16px;font-family:var(--serif);}
.mcq-option{
  display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:8px;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);font-size:.95rem;
}
.mcq-option:hover{border-color:var(--gold);}
.mcq-option.correct{border-color:var(--teal);background:var(--teal-dim);}
.mcq-option.incorrect{border-color:var(--brick);background:var(--brick-dim);}
.fill-input{
  font-size:1.05rem;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);
  min-width:160px;background:var(--panel);color:var(--text);
}
.flashcard{
  border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);
  padding:40px 24px;text-align:center;min-height:180px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
}
.why-btn{background:none;border:none;color:var(--gold);text-decoration:underline;font-size:.85rem;padding:0;}
.top-actions{display:flex;gap:10px;}
.icon-btn{
  border:1px solid var(--border);background:var(--panel);border-radius:var(--radius);
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--text);
  font-size:1.1rem;
}
.lesson-list-item{
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;background:var(--panel);
}
.lesson-list-item .meta{font-size:.8rem;color:var(--text-dim);}
.onboard-wrap{max-width:560px;margin:6vh auto;padding:0 20px;}
.onboard-step-count{font-size:.75rem;color:var(--text-dim);letter-spacing:.04em;margin-bottom:6px;}
textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--panel);color:var(--text);font-size:.95rem;resize:vertical;}
::selection{background:var(--gold-dim);}
.streak-flame{color:var(--gold);font-weight:700;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}

/* ---------- Phase-1 frontend expansion additions ---------- */
.nav-section-label{
  padding:14px 20px 4px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(245,243,237,.4);
}
.nav-section-toggle{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  background:none;border:none;cursor:pointer;
}
.nav-section-toggle:hover{color:rgba(245,243,237,.7);}
.nav-group-items.closed{display:none;}
.sidebar-foot{margin-top:auto;padding:14px 16px 4px;font-size:.75rem;}
.net-indicator{display:flex;align-items:center;gap:7px;color:rgba(245,243,237,.55);}
.net-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--text-dim);}
.net-indicator.online .net-dot{background:var(--teal);}
.net-indicator.offline .net-dot{background:var(--gold);}
.source-badge{
  display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;
  font-size:.68rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
  border:1px solid var(--border);color:var(--text-dim);vertical-align:middle;
}
.source-badge.local{color:var(--teal);border-color:var(--teal);background:var(--teal-dim);}
.source-badge.demo{color:var(--gold);border-color:var(--gold);background:var(--gold-dim);}
.source-badge.unavailable{color:var(--brick);border-color:var(--brick);background:var(--brick-dim);}
.not-connected-panel{
  border:1.5px dashed var(--border);border-radius:var(--radius);padding:22px;text-align:center;
  color:var(--text-dim);
}
.not-connected-panel strong{display:block;color:var(--text);margin-bottom:6px;font-family:var(--serif);font-size:1.05rem;}
.mock-audio-player{
  display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 18px;background:var(--paper-dim);
}
.mock-audio-player .play-btn{
  width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;
}
.mock-waveform{flex:1;display:flex;align-items:flex-end;gap:2px;height:32px;}
.mock-waveform span{flex:1;background:var(--gold);opacity:.55;border-radius:2px;}
.record-circle{
  width:88px;height:88px;border-radius:50%;background:var(--brick);color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto;
  box-shadow:0 0 0 6px var(--brick-dim);
}
.chat-bubble{max-width:80%;padding:11px 15px;border-radius:14px;margin-bottom:10px;line-height:1.5;font-size:.92rem;}
.chat-bubble.teacher{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:3px;}
.chat-bubble.user{background:var(--ink);color:var(--paper);margin-left:auto;border-bottom-right-radius:3px;}
.chat-quick-actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.challenge-card,.achievement-card{
  border:1px solid var(--border);border-radius:var(--radius);padding:16px;background:var(--panel);
}
.achievement-card.locked{opacity:.45;}
.achievement-card .badge-icon{font-size:1.6rem;margin-bottom:6px;}
.camera-frame{
  border:2px dashed var(--border);border-radius:8px;min-height:220px;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text-dim);
  background:var(--paper-dim);
}
.dialogue-line{margin-bottom:12px;}
.dialogue-line .npc{font-family:var(--serif);font-size:1.05rem;}
.search-result-group{margin-bottom:18px;}
.search-result-group h4{margin:0 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);}
@media (max-width:800px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;overflow-y:visible;max-height:none;padding:8px;}
  .sidebar .brand{display:none;}
  .nav-item{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:11px 14px;width:auto;}
  .nav-item.active{border-bottom-color:var(--gold);}
  .sidebar-foot{display:none;}
  .nav-section-label{display:none;}
  /* Accordion collapse is a desktop-only affordance (solves vertical
     overflow in a tall vertical sidebar). On mobile the sidebar becomes
     a horizontal scroll bar instead, which doesn't have that problem —
     and its section-toggle headers are hidden above, so there would be
     no way to expand a closed group here. Show every item, in a row. */
  .nav-group-items{display:flex !important;}
  .nav-group-items.closed{display:flex !important;}
  .content{padding:16px;}
}
</style>
</head>
